version: 0.2

env:
  variables:
    ARTIFACT_FILE: app.jar

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Instalando dependencias y preparando entorno"
      - mkdir -p build
  build:
    commands:
      - echo "Compilando aplicación Spring Boot"
      - mvn clean package -DskipTests
      - cp target/*.jar build/$ARTIFACT_FILE
  post_build:
    commands:
      - echo "Subiendo $ARTIFACT_FILE a S3"
      - aws s3 cp build/$ARTIFACT_FILE s3://$APP_BUCKET/$ARTIFACT_FILE
      - echo "Desplegando a EC2 vía SSM"
      - aws ssm send-command --document-name "AWS-RunShellScript" --comment "Despliegue automático desde CodePipeline" --targets "Key=instanceIds,Values=$APP_INSTANCE_ID" --parameters 'commands=["pkill -f app.jar || true", "cd /opt/app", "aws s3 cp s3://'$APP_BUCKET'/'$ARTIFACT_FILE' app.jar > deploy.log 2>&1", "nohup java -jar app.jar --server.port=80 > app.log 2>&1 &"]' --region $AWS_DEFAULT_REGION --output text

artifacts:
  files:
    - build/$ARTIFACT_FILE
